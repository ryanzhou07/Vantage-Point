# Local disposable development stack. No hosted project reference or credentials.
project_id = "vantage-point-local"
[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = true
[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 56324
[storage]
enabled = true
file_size_limit = "50MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_anonymous_sign_ins = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
